# Uploads the tracker to your web host every time something is pushed to main.
#
# Nothing is uploaded until you turn it on: in GitHub, go to
# Settings > Secrets and variables > Actions > Variables and add
# DEPLOY_ENABLED with the value true.
#
# The login details for your host are stored as GitHub secrets (never in this file):
#   SSH_HOST         e.g. yourdomain.com
#   SSH_PORT         usually 22 (optional, 22 is used if it is missing)
#   SSH_USER         your hosting account user name
#   SSH_PRIVATE_KEY  the private key, starting with -----BEGIN
#   DEPLOY_DIR       the folder on the host, ending with a slash, e.g. public_html/unit-tracker/
#
# config.php is never on GitHub and is skipped below, so the copy you made on
# the host stays as it is. Files are only added or updated, never deleted.
# After the upload, migrate.php upgrades the database if the code needs it.

name: Deploy to web host

on:
  push:
    branches: [main]
  # Also adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

# Never run two uploads at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up the SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Catch the most common mistake: a space or line break pasted into a secret.
          for name in SSH_HOST SSH_PORT SSH_USER; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::The secret $name is empty or missing."; exit 1
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "::error::The secret $name contains a space or line break. Re-enter it without spaces."; exit 1
            fi
            echo "$name is set (${#value} characters)."
          done
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Check the key before using it, with a clear message if it is wrong.
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY cannot be used. Either it is not a complete private key (from -----BEGIN to -----END), or it has a passphrase. Create a new key without a passphrase."
            exit 1
          fi
          # The fingerprint is not secret. Compare it with the key in cPanel.
          echo "Key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key
          # Remember the host's fingerprint so SSH does not stop to ask about it.
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload changed files to the host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          rsync -rltvz \
            --exclude 'config.php' \
            --exclude 'mail.log' \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'screenshots/' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR"

      - name: Upgrade the database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          # Runs migrate.php on the host. It uses the database login in the host's
          # config.php and only changes what is missing, so it is safe every time.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_DIR' && php migrate.php"

      - name: Remove the key again
        if: always()
        run: rm -f ~/.ssh/deploy_key
