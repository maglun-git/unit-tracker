  <path d="M0 240Q7 234 14 240T28 240T42 240T56 240T70 240T84 240T98 240T112 240T126 240T140 240T154 240T168 240T182 240T196 240T210 240T224 240T238 240T252 240T266 240T280 240T294 240T308 240T322 240T336 240T350 240T364 240T378 240T392 240T406 240T420 240T434 240" stroke-opacity=".6" stroke-width="1.4"/>
  <path d="M0 330H440" />
