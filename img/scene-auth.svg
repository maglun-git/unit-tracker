    </linearGradient>
    <linearGradient id="view" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7fa6e0" stop-opacity=".3"/><stop offset="1" stop-color="#7fa6e0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M332 52L270 330H410z" fill="url(#beam)" stroke="none"/>
  <path d="M232 128L60 120V250z" fill="url(#view)" stroke="none"/>
