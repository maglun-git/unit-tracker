<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" fill="none" stroke="#a9b4c6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0L12 12M12 0L0 12" stroke="#a9b4c6" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd75e" stop-opacity=".35"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="view" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa6e0" stop-opacity=".22"/><stop offset="1" stop-color="#7fa6e0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- light beams and camera view (drawn first so they sit behind) -->
  <path d="M232 26L180 140H300z" fill="url(#beam)" stroke="none"/>
  <path d="M872 26L820 140H940z" fill="url(#beam)" stroke="none"/>
  <path d="M552 44L700 96V20z" fill="url(#view)" stroke="none"/>
  <!-- fence -->
  <rect x="0" y="90" width="1200" height="50" fill="url(#mesh)" stroke="none"/>
  <path d="M0 90H1200" stroke-opacity=".7"/>
  <path d="M0 86V140M60 86V140M120 86V140M180 86V140M240 86V140M300 86V140M360 86V140M420 86V140M480 86V140M540 86V140M600 86V140M660 86V140M720 86V140M780 86V140M840 86V140M900 86V140M960 86V140M1020 86V140M1080 86V140M1140 86V140M1200 86V140" stroke-opacity=".8" stroke-width="2.4"/>
  <path d="M0 84Q6 80 12 84T24 84T36 84T48 84T60 84" stroke-opacity=".5"/>
  <path d="M600 84Q606 80 612 84T624 84T636 84T648 84T660 84T672 84T684 84T696 84T708 84T720 84" stroke-opacity=".5"/>
  <!-- ground -->
  <path d="M0 140H1200" stroke-opacity=".8"/>
  <!-- lamp posts -->
  <path d="M210 140V18h22" stroke-width="2.4"/>
  <path d="M224 18h16l-3 7h-10z" fill="#ffe9a8"/>
  <path d="M850 140V18h22" stroke-width="2.4"/>
  <path d="M864 18h16l-3 7h-10z" fill="#ffe9a8"/>
  <!-- camera pole with bullet camera -->
  <path d="M520 140V30" stroke-width="2.4"/>
  <path d="M520 36h12v6"/>
  <g transform="rotate(16 546 44)">
    <rect x="528" y="38" width="34" height="13" rx="3" fill="#eef2f8"/>
    <path d="M524 35h42"/>
    <circle cx="559" cy="44.5" r="2.8" fill="#a9b4c6"/>
  </g>
  <circle cx="531" cy="44" r="1.6" fill="#5ec486" stroke="none"/>
  <!-- cable from camera down and along the ground to the computer -->
  <path d="M523 48V138Q523 146 531 146H1006Q1012 146 1012 140" stroke-dasharray="3 4" stroke-opacity=".8"/>
  <!-- junction box -->
  <rect x="512" y="104" width="16" height="20" rx="2" fill="#eef2f8"/>
  <!-- small computer on a desk -->
  <path d="M960 140V118h80v22M956 118h88" />
  <rect x="972" y="86" width="44" height="28" rx="2" fill="#eef2f8"/>
  <path d="M994 86v28M972 100h44" stroke-opacity=".5"/>
  <path d="M988 114v4M1000 114v4"/>
  <rect x="1022" y="96" width="12" height="22" rx="1.5" fill="#eef2f8"/>
  <!-- dome camera on a building corner -->
  <path d="M1110 140V40h90" stroke-opacity=".7"/>
  <path d="M1118 40v4h22v-4" fill="#eef2f8"/>
  <path d="M1119 44a10 10 0 0 0 20 0" fill="#eef2f8"/>
  <circle cx="1129" cy="47" r="2.4" fill="#a9b4c6"/>
  <path d="M1110 60h90M1110 80h90M1110 100h90M1110 120h90" stroke-opacity=".25"/>
  <!-- PTZ on the left -->
  <path d="M60 140V54" stroke-width="2.4"/>
  <path d="M60 58h10v4"/>
  <path d="M62 62h16v5H62z" fill="#eef2f8"/>
  <path d="M64 67h12v5a6 6 0 0 1-12 0z" fill="#eef2f8"/>
  <circle cx="70" cy="73" r="2" fill="#a9b4c6"/>
  <path d="M63 68C40 70 44 140 60 140" stroke-dasharray="3 4" stroke-opacity=".6"/>
</svg>